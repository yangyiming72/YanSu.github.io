<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沉海 · 选择进入</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2314142b'/%3E%3Cpath d='M16 7l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z' fill='%23c9a86a'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#14142b;          /* 页面底色 */
    --panel:#22223f;       /* 卡片底色 */
    --panel-2:#2c2c4e;     /* 卡片悬浮 / 次级底色 */
    --line:#3d3d63;        /* 分隔线 */
    --text:#eef2ff;        /* 主文字 */
    --text-sub:#9ca3c7;    /* 次要文字 */
    --accent:#c9a86a;      /* 强调金 */
    --glow-blue:#4499ff;   /* 荧光蓝色，和封面保持一致 */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    position: relative;
    background: linear-gradient(rgba(20,20,43,.6),rgba(20,20,43,.6)), url("back.png") center/cover no-repeat fixed;
    color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    line-height:1.7;
    overflow-x:hidden;
  }

  /* ==========蓝色闪烁光点层【和index.html完全统一】========== */
  .glow-layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .glow-point {
    position: absolute;
    border-radius: 50%;
    background-color: #7fd1ff;
    box-shadow:
      0 0 6px 1px rgba(127, 209, 255, 0.9),
      0 0 14px 3px rgba(80, 160, 255, 0.7),
      0 0 28px 6px rgba(50, 120, 255, 0.45);
    opacity: 0;
    animation: glowBlink 3.5s ease-in-out infinite alternate,
               glowFloat 10s ease-in-out infinite alternate;
  }
  .glow-point--large { width: 11px; height: 11px; }
  .glow-point--medium { width: 7px; height: 7px; }
  .glow-point--small { width: 4px; height: 4px; }
  .glow-point--tiny {
    width: 2px;
    height: 2px;
    background-color: #b8eaff;
    box-shadow:
      0 0 4px 1px rgba(184, 234, 255, 0.8),
      0 0 10px 2px rgba(100, 180, 255, 0.5);
  }
  @keyframes glowBlink {
    0% { opacity: 0.1; transform: scale(0.85); }
    45% { opacity: 0.9; transform: scale(1.15); }
    100% { opacity: 0.25; transform: scale(0.95); }
  }
  @keyframes glowFloat {
    0% { transform: translate(0px, 0px); }
    50% { transform: translate(14px, -10px); }
    100% { transform: translate(-10px, 16px); }
  }

  a{color:var(--accent);text-decoration:none;}
  img{display:block;max-width:100%;}
  .wrap{
    position: relative;
    z-index: 1; /* 内容置于光点上层 */
    max-width:1100px;margin:0 auto;padding:2rem 1.25rem;
  }
  .back-btn{
    display:inline-flex;align-items:center;gap:.4rem;
    color:var(--text-sub);font-size:1rem;margin-bottom:1.5rem;
    border:1px solid var(--line);border-radius:10px;padding:.45rem .9rem;
    transition:.2s;
  }
  .back-btn:hover{color:var(--accent);border-color:var(--accent);}
  h1.page-title{
    text-align:center;font-weight:600;letter-spacing:.15em;
    margin-bottom:3rem;color:var(--text);
  }
  .menu-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:3rem;
    min-height:420px;
  }
  .menu-circle{
    width:220px;
    height:220px;
    border-radius:50%;
    background:var(--panel);
    border:2px solid var(--line);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:1.6rem;
    transition:0.35s ease;
    cursor:pointer;
    text-decoration:none;
    position:relative;
    overflow:hidden;
  }
  .menu-circle::after{
    content:"";
    position:absolute;
    top:14%;
    left:22%;
    width:32%;
    height:18%;
    background:radial-gradient(ellipse, rgba(255,255,255,0.18), transparent 70%);
    border-radius:50%;
    pointer-events:none;
    opacity:0.5;
    transition:0.35s;
  }
  /* 球形内图片容器 */
  .menu-circle-img{
    width:70px;
    height:70px;
    border-radius:50%;
    overflow:hidden;
    margin-bottom:0.7rem;
    flex-shrink:0;
  }
  .menu-circle-img img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .menu-circle h2{
    font-size:1.2rem;
    letter-spacing:.2em;
    margin-bottom:0.4rem;
    color:var(--text);
  }
  .menu-circle p{
    font-size:0.78rem;
    color:var(--text-sub);
    line-height:1.5;
  }
  .menu-circle:hover{
    transform: translateY(-10px) scale(1.04);
    border-color:var(--accent);
    background:var(--panel-2);
    box-shadow: 0 0 30px rgba(201,168,106,0.35);
  }
  .menu-circle:hover::after{
    opacity:1;
  }
  @media(max-width:640px){
    .menu-circle{
      width:170px;
      height:170px;
      padding:1.2rem;
    }
    .menu-circle-img{
      width:54px;
      height:54px;
    }
    .menu-circle h2{
      font-size:1rem;
    }
    .menu-circle p{
      font-size:0.7rem;
    }
    .menu-wrap{
      gap:2rem;
    }
  }
  /* ============ 下面是你原有其他页面样式，保持不变 ============ */
  body.cover-page{padding:0;overflow:hidden;}
  .cover{
    position:fixed;inset:0;cursor:pointer;
    background:
      linear-gradient(rgba(20,20,43,.55),rgba(20,20,43,.55)),
      url("back.png") center/cover no-repeat;
  }
  .cover-inner{
    height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:2rem;gap:1.25rem;
  }
  .cover-inner h1{font-size:clamp(1.8rem,6vw,3rem);letter-spacing:.3em;font-weight:600;}
  .cover-sub{color:var(--text-sub);letter-spacing:.3em;font-size:.95rem;}
  .cover-tip{
    color:var(--text-sub);letter-spacing:.2em;font-size:.9rem;
    animation:blink 2.2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:.45;}50%{opacity:1;}}
  .oc-grid{display:grid;grid-template-columns:1fr;gap:1.75rem;}
  @media(min-width:700px){.oc-grid{grid-template-columns:repeat(3,1fr);}}
  .oc-card{
    background:var(--panel);border-radius:16px;padding:1.25rem;text-align:center;
    transition:.25s;
  }
  .oc-card:hover{background:var(--panel-2);transform:translateY(-6px);}
  .oc-card .pic{
    width:100%;height:380px;border-radius:12px;overflow:hidden;margin-bottom:1rem;
    background:#0e0e22;
  }
  .oc-card .pic img{width:100%;height:100%;object-fit:cover;}
  .oc-card a.name{font-size:1.3rem;font-weight:600;letter-spacing:.15em;}
  .detail-head{text-align:center;margin-bottom:2rem;}
  .detail-head h1{font-size:2rem;letter-spacing:.2em;}
  .section-block{
    background:var(--panel);border-radius:14px;padding:1.5rem;margin-bottom:1.75rem;
  }
  .section-block h2{
    color:var(--accent);border-left:3px solid var(--accent);
    padding-left:.75rem;margin-bottom:1rem;font-weight:600;letter-spacing:.1em;
  }
  .section-block h3{
    color:var(--accent);font-size:1.05rem;letter-spacing:.1em;
    margin:1.25rem 0 .4rem;font-weight:600;
  }
  .todo{color:var(--text-sub);font-size:.88rem;margin:.5rem 0;}
  .img-box{margin:.5rem 0;}
  .img-box img{max-width:420px;border-radius:10px;background:#0e0e22;}
  .placeholder-text{color:var(--text-sub);}
  .chapter{background:var(--panel);border-radius:16px;padding:1.75rem;margin-bottom:2rem;}
  .chapter .ch-no{color:var(--accent);letter-spacing:.3em;font-size:.85rem;margin-bottom:.4rem;}
  .chapter h2{font-size:1.4rem;margin-bottom:1rem;letter-spacing:.1em;}
  .chapter .ch-cover{margin:1rem 0;border-radius:12px;overflow:hidden;background:#0e0e22;}
  .chapter .ch-cover img{width:100%;max-height:340px;object-fit:cover;}
  .chapter p.body{margin:.75rem 0;}
  .ch-list{display:grid;grid-template-columns:1fr;gap:1.5rem;}
  @media(min-width:700px){.ch-list{grid-template-columns:repeat(3,1fr);}}
  .ch-link-card{
    display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:1.75rem 1.5rem;transition:.25s;text-align:left;
  }
  .ch-link-card:hover{background:var(--panel-2);transform:translateY(-4px);border-color:var(--accent);}
  .ch-link-card .ch-no{color:var(--accent);letter-spacing:.3em;font-size:.85rem;margin-bottom:.6rem;}
  .ch-link-card h2{font-size:1.2rem;letter-spacing:.1em;margin-bottom:.5rem;color:var(--text);}
  .ch-link-card p{color:var(--text-sub);font-size:.9rem;}
  .ch-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;}
  .ch-nav a{
    color:var(--text-sub);border:1px solid var(--line);border-radius:10px;
    padding:.5rem 1rem;font-size:.9rem;transition:.2s;
  }
  .ch-nav a:hover{color:var(--accent);border-color:var(--accent);}
</style>
</head>
