<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番外故事</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: url("back.png") no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            color: #fff;
        }
        .page {
            position: absolute;
            inset: 0;
            padding: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .page.active {
            opacity: 1;
            pointer-events: auto;
        }
        #home {
            position: relative;
        }
        .circle-link {
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: absolute;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            border: 3px solid rgba(255,255,255,0.35);
        }
        .circle-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .circle-link::after {
            content: '';
            position: absolute;
            top: 12%;
            left: 25%;
            width: 35%;
            height: 20%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.45), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .circle-link:hover {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: 0 18px 40px rgba(90, 130, 255, 0.45);
            border-color: rgba(255,255,255,0.85);
        }
        .circle-link:hover::after {
            opacity: 0.9;
        }
        /* 全局固定返回menu按钮，始终在左上角，层级最高 */
        .global-back-menu{
            position: fixed;
            top:24px;
            left:24px;
            z-index:9999;
            padding:10px 20px;
            background: rgba(255,255,255,0.15);
            border:1px solid rgba(255,255,255,0.3);
            border-radius:999px;
            color:#fff;
            text-decoration:none;
            transition:0.3s;
        }
        .global-back-menu:hover{
            background: rgba(255,255,255,0.25);
        }
        .back-btn {
            position: fixed;
            top: 72px;
            left: 24px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 999px;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.25);
        }
        .page-content {
            max-width: 800px;
            margin: 80px auto 0;
        }
        .page-content h2 {
            margin-bottom: 20px;
            font-size: 32px;
        }
        .page-content p {
            line-height: 1.8;
            opacity: 0.85;
        }
        /* 子页面图片自适应，大图自动缩小，不会溢出容器 */
        .page-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 16px 0;
            border: 10px solid rgba(255,255,255,0.35);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- 固定在左上角，跳转到menu.html，不参与漂浮动画 -->
    <a href="menu.html" class="global-back-menu">← 返回首页</a>
    <div id="home" class="page active"></div>

    <div id="pageI" class="page">
        <button class="back-btn" onclick="switchPage('home')">← 返回选项页</button>
        <div class="page-content">
            <h2>渝纪</h2>
            <p>
                <img src="91.png" >

<script>
    const circleList = [
        { target: "pageA", img: "12.png" },
        { target: "pageB", img: "21.png" },
        { target: "pageC", img: "ling ex.png" },
        { target: "pageD", img: "yuxu ex.png" },
        { target: "pageE", img: "zhangshiye ex.png" },
        { target: "pageF", img: "6ex.png" },
        { target: "pageG", img: "76.png" },
        { target: "pageH", img: "82.png" },
        { target: "pageI", img: "92.png" }
 ];
    const minScale = 0.8;
    const maxScale = 1.2;
    const padding = 16;
    const homeWrap = document.getElementById("home");
    let circleDataList = [];
    let animationId = null;
    function checkOverlap(x, y, r, list, excludeIndex = -1) {
        for (let i = 0; i < list.length; i++) {
            if (i === excludeIndex) continue;
            const item = list[i];
            const dx = x - item.x;
            const dy = y - item.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < (r + item.r + padding)) {
                return true;
            }
        }
        return false;
    }
    function generateCircles() {
        if (animationId) cancelAnimationFrame(animationId);
        const w = window.innerWidth;
        const h = window.innerHeight;
        circleDataList = [];
        homeWrap.innerHTML = "";
        const area = w * h;
        const baseArea = area / (circleList.length * 2.8);
        const baseSize = Math.sqrt(baseArea);
        for (const info of circleList) {
            const scale = minScale + Math.random() * (maxScale - minScale);
            const size = baseSize * scale;
            const radius = size / 2;
            let ok = false;
            let cx, cy;
            for (let i = 0; i < 120; i++) {
                cx = radius + Math.random() * (w - size);
                cy = radius + Math.random() * (h - size);
                if (!checkOverlap(cx, cy, radius, circleDataList)) {
                    ok = true;
                    break;
                }
            }
            if (!ok) continue;
            // 漂浮参数：速度很慢，方向随机
            const speed = 0.10 + Math.random() * 0.18;
            const angle = Math.random() * Math.PI * 2;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            const div = document.createElement("div");
            div.className = "circle-link";
            div.style.width = size + "px";
            div.style.height = size + "px";
            div.style.left = (cx - radius) + "px";
            div.style.top = (cy - radius) + "px";
            div.dataset.target = info.target;
            div.innerHTML = `<img src="${info.img}" alt="">`;
            div.addEventListener("click", ()=>switchPage(info.target));
            homeWrap.appendChild(div);
            circleDataList.push({
                el: div,
                x: cx,
                y: cy,
                r: radius,
                vx,
                vy,
                size
            });
        }
        startFloatAnimation();
    }
    function startFloatAnimation() {
        function loop() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            for (let i = 0; i < circleDataList.length; i++) {
                const item = circleDataList[i];
                let nx = item.x + item.vx;
                let ny = item.y + item.vy;
                // 边界反弹
                if (nx - item.r <= 0 || nx + item.r >= w) item.vx *= -1;
                if (ny - item.r <= 0 || ny + item.r >= h) item.vy *= -1;
                // 碰撞检测，撞到别的圆就反弹
                if (checkOverlap(nx, ny, item.r, circleDataList, i)) {
                    item.vx *= -1;
                    item.vy *= -1;
                } else {
                    item.x = nx;
                    item.y = ny;
                }
                item.el.style.left = (item.x - item.r) + "px";
                item.el.style.top = (item.y - item.r) + "px";
            }
            animationId = requestAnimationFrame(loop);
        }
        loop();
    }
    function switchPage(targetId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(targetId).classList.add('active');
        if(targetId === "home"){
            // 返回首页：禁止滚动，并且滚回顶部
            document.body.style.overflow = "hidden";
            window.scrollTo(0,0);
        }else{
            // 打开子页面：开启滚动
            document.body.style.overflow = "auto";
        }
    }
    generateCircles();
    window.addEventListener("resize", generateCircles);
</script>

<audio id="bgMusic" loop>
  <source src="the sea.mp3" type="audio/mpeg" />

<audio id="clickSound">
  <source src="click.mp3" type="audio/mpeg" />


<script>
  const audio = document.getElementById('bgMusic');
  const clickAudio = document.getElementById('clickSound');
  audio.volume = 0.3;      // BGM音量
  clickAudio.volume = 0.5; // 点击音效音量，可以改小比如0.3
  let hasPlayedBgm = false;
  document.addEventListener('click', function(e) {
    // 播放点击音效（每次点击都响）
    clickAudio.currentTime = 0; // 重置到开头，快速连续点击也能正常响
    clickAudio.play();
    // 第一次点击才启动背景音乐
    if (!hasPlayedBgm) {
      audio.play();
      hasPlayedBgm = true;
    }
  });
</script>
</body>
</html>
